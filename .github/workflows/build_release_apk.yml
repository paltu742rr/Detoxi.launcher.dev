name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/keystore/keystore.jks

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APKs
        run: |
          # Generic: try to assemble all release variants across modules
          ./gradlew clean assembleRelease --no-daemon || true
          # also try bundle in case project expects AAB
          ./gradlew bundleRelease --no-daemon || true

      - name: Find and upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            **/build/outputs/apk/**/release/*.apk
            **/build/outputs/bundle/**/release/*.aab
            **/build/outputs/apk/**/*.apk
